name: Seed CDC disease surveillance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'   # Everyday at midnight UTC

concurrency:
  group: cdc-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r disease-outbreak-model/backend/backend/requirements.txt

      - name: Seed flu and COVID surveillance data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: disease-outbreak-model/backend
        run: |
          python -m backend.scripts.seed_cdc_surveillance