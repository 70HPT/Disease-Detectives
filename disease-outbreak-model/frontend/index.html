<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disease Detectives</title>

    <!-- ============================================
         LOADING SCREEN — Pure CSS, renders before JS
         Dismissed by React when Three.js scene is ready
         ============================================ -->
    <style>
        #loading-screen {
          position: fixed;
          inset: 0;
          z-index: 99999;
          background: #000000;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          opacity: 1;
          transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #loading-screen.fade-out {
          opacity: 0;
          pointer-events: none;
        }

        /* Circle of 8 dots — sequential fade animation */
        .loader {
          width: 56px;
          height: 56px;
          position: relative;
        }

        .loader-dot {
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #00ffcc;
          opacity: 0.15;
          animation: dotPulse 1s ease-in-out infinite;
        }

        /* Position 8 dots in a circle (radius ~22px from center) */
        .loader-dot:nth-child(1) { top: 0;    left: 23px; animation-delay: 0s; }
        .loader-dot:nth-child(2) { top: 6px;  left: 39px; animation-delay: 0.125s; }
        .loader-dot:nth-child(3) { top: 23px; left: 46px; animation-delay: 0.25s; }
        .loader-dot:nth-child(4) { top: 39px; left: 39px; animation-delay: 0.375s; }
        .loader-dot:nth-child(5) { top: 46px; left: 23px; animation-delay: 0.5s; }
        .loader-dot:nth-child(6) { top: 39px; left: 6px;  animation-delay: 0.625s; }
        .loader-dot:nth-child(7) { top: 23px; left: 0;    animation-delay: 0.75s; }
        .loader-dot:nth-child(8) { top: 6px;  left: 6px;  animation-delay: 0.875s; }

        @keyframes dotPulse {
          0%, 60%, 100% { opacity: 0.15; transform: scale(0.8); }
          30% { opacity: 1; transform: scale(1.1); }
        }

        .loader-text {
          color: rgba(0, 255, 204, 0.45);
          font-family: 'Rajdhani', -apple-system, sans-serif;
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 4px;
          text-transform: uppercase;
          animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
          0%, 100% { opacity: 0.35; }
          50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
<!-- Loading screen — visible immediately, before React mounts -->
<div id="loading-screen">
    <div class="loader">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
    </div>
    <span class="loader-text">Loading</span>
</div>

<!-- React root -->
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
